[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "reverselab-ai"
version = "0.3.0"
description = "Laboratorio local de engenharia reversa estatica com LLM opcional"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["reverselab*"]

[tool.setuptools.package-data]
reverselab = ["static/*.html", "static/*.css", "static/*.js", "ghidra_scripts/*.py"]
